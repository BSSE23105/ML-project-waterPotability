# SonarQube analysis settings for the Water Potability Classifier
# SE307T Assignment 1, Part (b)

sonar.projectKey=water-potability
sonar.projectName=Water Potability Classifier
sonar.projectVersion=1.0

# Analyse the training pipeline, the shared modules and the FastAPI service
sonar.sources=train.py,src,api
sonar.exclusions=**/artifacts/**,**/*.csv,**/*.joblib,**/*.png

sonar.python.version=3.11
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml
